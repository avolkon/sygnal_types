[project]
name = "sygnal-clustering"
version = "0.1.0"
description = "Clustering pipeline for scintillation detector signals"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_notebooks.py" = ["E501"]
"scripts/legacy/generate_notebooks_v1_v2.py" = ["E501"]
"scripts/legacy/generate_notebooks_v3_v4.py" = ["E501", "W291"]
"scripts/legacy/generate_notebooks_v5_v6.py" = ["E501", "W291"]
"scripts/tune_method_c.py" = ["E501"]
